[network]
tlscert = /var/opt/mssql/certs/mssql-live.pem
tlskey = /var/opt/mssql/certs/mssql-live.key
tlsprotocols = 1.2
# Optional encryption: clients that pass encrypt:true still negotiate TLS with
# the self-signed cert. Leaving forceencryption off keeps encrypt:false live
# tests on the cleartext path (avoids long-lived TDS-TLS bridge stress).
forceencryption = 0
