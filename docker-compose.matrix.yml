services:
  sqlserver-2017:
    build: { context: ., dockerfile: docker/live/Dockerfile, args: { MSSQL_IMAGE: mcr.microsoft.com/mssql/server:2017-latest } }
    image: mssql-dart-live:2017
    container_name: mssql-dart-live-2017
    environment: { ACCEPT_EULA: "Y", MSSQL_PID: Developer, MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Strong_test_password_123!}" }
    ports: ["14330:1433"]
  sqlserver-2017-force-tls:
    build: { context: ., dockerfile: docker/live/Dockerfile, args: { MSSQL_IMAGE: mcr.microsoft.com/mssql/server:2017-latest } }
    image: mssql-dart-live:2017
    container_name: mssql-dart-live-2017-force-tls
    environment: { ACCEPT_EULA: "Y", MSSQL_PID: Developer, MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Strong_test_password_123!}" }
    ports: ["14331:1433"]
    volumes: ["./docker/live/mssql.forceencryption.conf:/var/opt/mssql/mssql.conf:ro"]
  sqlserver-2019:
